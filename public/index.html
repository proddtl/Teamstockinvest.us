<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopStock - Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-blue {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .gradient-green {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .gradient-red {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }
        .gradient-orange {
            background: linear-gradient(135deg, #ffa726 0%, #fb8c00 100%);
        }
        .cube-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #ffd700, #ffed4e, #fff59d);
            transform: perspective(100px) rotateX(15deg) rotateY(-15deg);
            border-radius: 4px;
            position: relative;
        }
        .cube-logo::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 8px;
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #ffed4e, #fff59d);
            transform: rotateX(90deg);
            border-radius: 4px;
        }
        .cube-logo::after {
            content: '';
            position: absolute;
            top: 8px;
            right: -8px;
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #fff59d, #ffeb3b);
            transform: rotateY(90deg);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Success Notification -->
    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-b-lg mx-4 mb-4 flex items-center justify-between">
        <div class="flex items-center">
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
            </svg>
            <span>Successfully Logged In</span>
        </div>
        <button class="text-green-700 hover:text-green-900">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
        </button>
    </div>

    <!-- Header -->
    <header class="bg-white shadow-sm px-4 py-3 mb-6">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="cube-logo"></div>
                <h1 class="text-xl font-bold text-gray-800">topstock</h1>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-gray-600">Karen Derner</span>
                <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                </svg>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="px-4 pb-20">
        <!-- Account Balance -->
        <div class="gradient-blue rounded-2xl p-6 text-white mb-6 relative overflow-hidden">
            <div class="absolute top-4 right-4 w-16 h-16 bg-white bg-opacity-20 rounded-full"></div>
            <div class="relative z-10">
                <p class="text-white text-opacity-90 mb-2">Account balance</p>
                <h2 class="text-4xl font-bold">62,800.00 USD</h2>
            </div>
        </div>

        <!-- Metric Cards -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-blue-500 rounded-2xl p-4 text-white">
                <div class="flex items-center mb-2">
                    <svg class="w-6 h-6 mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>
                <p class="text-white text-opacity-90 text-sm mb-1">Total withdraw</p>
                <p class="text-xl font-bold">0.00 USD</p>
            </div>
            
            <div class="gradient-green rounded-2xl p-4 text-white">
                <div class="flex items-center mb-2">
                    <svg class="w-6 h-6 mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                </div>
                <p class="text-white text-opacity-90 text-sm mb-1">Total deposit</p>
                <p class="text-xl font-bold">0.00 USD</p>
            </div>
            
            <div class="gradient-red rounded-2xl p-4 text-white">
                <div class="flex items-center mb-2">
                    <svg class="w-6 h-6 mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M11,8V14.17L8.83,12L7.41,13.41L12,18L16.59,13.41L15.17,12L13,14.17V8H11M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2Z"/>
                    </svg>
                </div>
                <p class="text-white text-opacity-90 text-sm mb-1">Total invest</p>
                <p class="text-xl font-bold">0.00 USD</p>
            </div>
            
            <div class="gradient-orange rounded-2xl p-4 text-white">
                <div class="flex items-center mb-2">
                    <svg class="w-6 h-6 mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"/>
                    </svg>
                </div>
                <p class="text-white text-opacity-90 text-sm mb-1">Current invest</p>
                <p class="text-xl font-bold">0 USD</p>
            </div>
        </div>

        <!-- More Options -->
        <div class="bg-white rounded-2xl p-6 mb-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">More options</h3>
            <div class="flex justify-around">
                <button class="w-16 h-16 bg-orange-200 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-orange-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"/>
                    </svg>
                </button>
                <button class="w-16 h-16 bg-cyan-200 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-cyan-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"/>
                    </svg>
                </button>
                <button class="w-16 h-16 bg-blue-200 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"/>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-2">
        <div class="flex justify-around">
            <button class="flex flex-col items-center py-2 text-gray-400">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"/>
                </svg>
                <span class="text-xs">Deposit</span>
            </button>
            <button class="flex flex-col items-center py-2 text-gray-400">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <span class="text-xs">My invest</span>
            </button>
            <button class="flex flex-col items-center py-2 text-yellow-600">
                <div class="w-8 h-8 bg-yellow-500 rounded-full flex items-center justify-center mb-1">
                    <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"/>
                    </svg>
                </div>
                <span class="text-xs font-medium">Home</span>
            </button>
            <button class="flex flex-col items-center py-2 text-gray-400">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M11,8V14.17L8.83,12L7.41,13.41L12,18L16.59,13.41L15.17,12L13,14.17V8H11M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2Z"/>
                </svg>
                <span class="text-xs">Withdraw</span>
            </button>
            <button class="flex flex-col items-center py-2 text-gray-400">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M9,11H15L13,9L15,7H9V9L11,11L9,13V11M2,12C2,9.21 4.79,7 8,7C9.5,7 10.85,7.57 11.82,8.5L14,6.29C12.34,4.84 10.27,4 8,4C3.58,4 0,7.58 0,12S3.58,20 8,20C10.27,20 12.34,19.16 14,17.71L11.82,15.5C10.85,16.43 9.5,17 8,17C4.79,17 2,14.79 2,12Z"/>
                </svg>
                <span class="text-xs">Transfer</span>
            </button>
        </div>
    </nav>

    <script>
        // Basic JavaScript for button interactions (non-functional)
        document.addEventListener('DOMContentLoaded', function() {
            // Add click handlers for buttons (no actual functionality)
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    console.log('Button clicked:', this.textContent || 'Button');
                });
            });
        });
    </script>
</body>
</html>

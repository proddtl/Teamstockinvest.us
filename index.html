<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopStock - Financial Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-blue { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .gradient-green { background: linear-gradient(135deg, #10b981, #059669); }
        .gradient-red { background: linear-gradient(135deg, #ef4444, #ec4899); }
        .gradient-orange { background: linear-gradient(135deg, #f97316, #ea580c); }
        .gradient-yellow { background: linear-gradient(135deg, #facc15, #eab308); }
        .gradient-cyan { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    </style>
</head>
<body class="min-h-screen bg-gray-100 flex flex-col">
    <!-- Success Notification -->
    <div class="bg-green-100 border-l-4 border-green-500 p-4 flex items-center justify-between">
        <div class="flex items-center">
            <div class="w-5 h-5 bg-green-500 rounded-full flex items-center justify-center mr-3">
                <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                </svg>
            </div>
            <span class="text-green-800 font-medium">Successfully Logged In</span>
        </div>
        <button class="text-green-600 hover:text-green-800">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
        </button>
    </div>

    <!-- Dashboard Header -->
    <div class="bg-white px-4 py-6 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <!-- TopStock Logo -->
            <div class="w-12 h-12 gradient-yellow rounded-lg flex items-center justify-center relative">
                <div class="w-4 h-4 bg-yellow-300 rounded-sm transform rotate-45 absolute top-1 left-1"></div>
                <div class="w-4 h-4 bg-yellow-200 rounded-sm transform rotate-45 absolute top-2 left-3"></div>
                <div class="w-4 h-4 bg-yellow-100 rounded-sm transform rotate-45 absolute top-3 left-5"></div>
            </div>
            <span class="text-2xl font-bold text-gray-800">topstock</span>
        </div>

        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2">
                <span class="text-gray-700 font-medium">Karen Derner</span>
                <svg class="w-5 h-5 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
            </div>
            <button class="text-red-600 hover:text-red-800 font-medium">Logout</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-4 pb-24 space-y-6">
        <!-- Account Balance -->
        <div class="gradient-blue rounded-2xl p-6 text-white mb-6 relative overflow-hidden">
            <!-- Background decoration -->
            <div class="absolute top-4 right-4 w-16 h-16 bg-white/10 rounded-full"></div>
            <div class="absolute -top-8 -right-8 w-24 h-24 bg-white/5 rounded-full"></div>
            
            <div class="relative">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-medium opacity-90">Account balance</h2>
                    <div class="w-8 h-8 bg-white/20 rounded-full"></div>
                </div>
                <div class="text-4xl font-bold">62,800.00 USD</div>
            </div>
        </div>

        <!-- Metric Cards -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <!-- Total Withdraw -->
            <div class="gradient-blue rounded-2xl p-4 text-white">
                <div class="flex items-center justify-between mb-3">
                    <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/>
                        </svg>
                    </div>
                </div>
                <div class="space-y-1">
                    <p class="text-sm opacity-90">Total withdraw</p>
                    <p class="text-xl font-bold">0.00 USD</p>
                </div>
            </div>

            <!-- Total Deposit -->
            <div class="gradient-green rounded-2xl p-4 text-white">
                <div class="flex items-center justify-between mb-3">
                    <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                </div>
                <div class="space-y-1">
                    <p class="text-sm opacity-90">Total deposit</p>
                    <p class="text-xl font-bold">0.00 USD</p>
                </div>
            </div>

            <!-- Total Invest -->
            <div class="gradient-red rounded-2xl p-4 text-white">
                <div class="flex items-center justify-between mb-3">
                    <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/>
                        </svg>
                    </div>
                </div>
                <div class="space-y-1">
                    <p class="text-sm opacity-90">Total invest</p>
                    <p class="text-xl font-bold">0.00 USD</p>
                </div>
            </div>

            <!-- Current Invest -->
            <div class="gradient-orange rounded-2xl p-4 text-white">
                <div class="flex items-center justify-between mb-3">
                    <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                        </svg>
                    </div>
                </div>
                <div class="space-y-1">
                    <p class="text-sm opacity-90">Current invest</p>
                    <p class="text-xl font-bold">0 USD</p>
                </div>
            </div>
        </div>

        <!-- More Options -->
        <div class="bg-white rounded-2xl p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-6">More options</h3>
            <div class="flex justify-center space-x-8">
                <button class="gradient-orange w-16 h-16 rounded-full flex items-center justify-center shadow-lg hover:shadow-xl transition-shadow">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                </button>
                <button class="gradient-cyan w-16 h-16 rounded-full flex items-center justify-center shadow-lg hover:shadow-xl transition-shadow">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                </button>
                <button class="gradient-blue w-16 h-16 rounded-full flex items-center justify-center shadow-lg hover:shadow-xl transition-shadow">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Transaction History -->
        <div class="bg-white rounded-2xl p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Recent Transactions</h3>
            <p class="text-gray-500">No transactions yet</p>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200">
        <div class="flex justify-around py-2">
            <a href="#" class="flex flex-col items-center py-2 px-3 rounded-lg text-gray-500 hover:text-gray-700">
                <div class="p-2 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                    </svg>
                </div>
                <span class="text-xs mt-1 font-medium">Deposit</span>
            </a>
            <a href="#" class="flex flex-col items-center py-2 px-3 rounded-lg text-gray-500 hover:text-gray-700">
                <div class="p-2 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                    </svg>
                </div>
                <span class="text-xs mt-1 font-medium">My invest</span>
            </a>
            <a href="#" class="flex flex-col items-center py-2 px-3 rounded-lg text-yellow-600">
                <div class="p-2 rounded-full bg-yellow-100">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                </div>
                <span class="text-xs mt-1 font-medium">Home</span>
            </a>
            <a href="#" class="flex flex-col items-center py-2 px-3 rounded-lg text-gray-500 hover:text-gray-700">
                <div class="p-2 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/>
                    </svg>
                </div>
                <span class="text-xs mt-1 font-medium">Withdraw</span>
            </a>
            <a href="#" class="flex flex-col items-center py-2 px-3 rounded-lg text-gray-500 hover:text-gray-700">
                <div class="p-2 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                    </svg>
                </div>
                <span class="text-xs mt-1 font-medium">Transfer</span>
            </a>
        </div>
    </div>
</body>
</html>
